version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - highload-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    networks:
      - highload-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: .
    container_name: app1
    environment:
      - INSTANCE_NAME=app1
    depends_on:
      - postgres
      - redis
    networks:
      - highload-net

  app2:
    build: .
    container_name: app2
    environment:
      - INSTANCE_NAME=app2
    depends_on:
      - postgres
      - redis
    networks:
      - highload-net

  app3:
    build: .
    container_name: app3
    environment:
      - INSTANCE_NAME=app3
    depends_on:
      - postgres
      - redis
    networks:
      - highload-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - highload-net

volumes:
  pgdata:

networks:
  highload-net:
    driver: bridge