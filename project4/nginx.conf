events { worker_connections 1024; }

http {
    upstream fastapi_app {
        server app1;
        server app2;
        server app3;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}